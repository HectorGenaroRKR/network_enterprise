enable
configure terminal
hostname HQ-CMX-SWA03

interface GigabitEthernet1/1
 description Link to Switch Core 01 (HQ-CMX-SWC01 Gi3/1 - Po3)
 no shutdown

interface GigabitEthernet1/2
 description Link to Switch Core 01 (HQ-CMX-SWC01 Gi3/2 - Po3)
 no shutdown

interface GigabitEthernet2/1
 description Link to Switch Core 02 (HQ-CMX-SWC02 Gi3/1 - Po6)
 no shutdown

interface GigabitEthernet2/2
 description Link to Switch Core 02 (HQ-CMX-SWC02 Gi3/2 - Po6)
 no shutdown

interface GigabitEthernet0/0
 description Link to PC in VLAN 10 (HQ-CMX-SWA03-PCV10)
 no shutdown

interface GigabitEthernet0/1
 description Link to PC in VLAN 20 (HQ-CMX-SWA03-PCV20)
 no shutdown

interface GigabitEthernet0/2
 description Link to PC in VLAN 30 (HQ-CMX-SWA03-PCV30)
 no shutdown

interface GigabitEthernet0/3
 description Link to PC in VLAN 40 (HQ-CMX-SWA03-PCV40)
 no shutdown
end
write memory

!Configuracion de VLANs
enable
configure terminal
vlan 10
 name MANAGEMENT
vlan 20
 name USERS
vlan 30
 name VoIP
vlan 40
 name SERVERS
vlan 99
 name NATIVE
vlan 999
 name BLACKHOLE
end
write memory

!Configuracion de STP
enable
configure terminal
spanning-tree mode rapid-pvst
spanning-tree vlan 1 priority 36864
spanning-tree vlan 10 priority 36864
spanning-tree vlan 20 priority 36864
spanning-tree vlan 30 priority 36864
spanning-tree vlan 40 priority 36864
spanning-tree vlan 99 priority 36864
spanning-tree vlan 999 priority 36864
end
write memory

!Configuracion de Etherchannel
enable
configure terminal
interface range GigabitEthernet1/1-2
channel-group 1 mode active
interface range GigabitEthernet2/1-2
channel-group 2 mode active
end
write

!Configuracion de Trunk
enable
configure terminal
interface port-channel 1
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk allowed vlan 10,20,30,40
switchport trunk native vlan 99
interface port-channel 2
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk allowed vlan 10,20,30,40
switchport trunk native vlan 99
end
write