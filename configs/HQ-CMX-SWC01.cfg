enable
configure terminal
hostname HQ-CMX-SWC01

interface GigabitEthernet0/1
    description Link to Router Core 01 (HQ-CMX-RTR01 Gi1/0)
    no shutdown

interface GigabitEthernet0/2
    description Link to Router Core 02 (HQ-CMX-RTR02 Gi1/0)
    no shutdown

interface GigabitEthernet1/1
    description Link to Switch Access 01 (HQ-CMX-SWA01 Gi1/1 - Po1)
    no shutdown

interface GigabitEthernet1/2
    description Link to Switch Access 01 (HQ-CMX-SWA01 Gi1/2 - Po1)
    no shutdown

interface GigabitEthernet2/1
    description Link to Switch Access 02 (HQ-CMX-SWA02 Gi1/1 - Po2)
    no shutdown

interface GigabitEthernet2/2
    description Link to Switch Access 02 (HQ-CMX-SWA02 Gi1/2 - Po2)
    no shutdown

interface GigabitEthernet3/1
    description Link to Switch Access 03 (HQ-CMX-SWA03 Gi1/1 - Po3)
    no shutdown

interface GigabitEthernet3/2
    description Link to Switch Access 03 (HQ-CMX-SWA03 Gi1/2 - Po3)
    no shutdown
end
write memory

!Configuracion de VLANs
enable
configure terminal
vlan 10
    name MANAGEMENT
vlan 20
    name USERS
vlan 30
    name VoIP
vlan 40
    name SERVERS
vlan 99
    name NATIVE
vlan 999
    name BLACKHOLE
end
write memory

!Configuracion de STP
enable
configure terminal
spanning-tree mode rapid-pvst
spanning-tree vlan 1 priority 0
spanning-tree vlan 10 priority 0
spanning-tree vlan 40 priority 0
spanning-tree vlan 999 priority 0

spanning-tree vlan 20 priority 4096
spanning-tree vlan 30 priority 4096
spanning-tree vlan 99 priority 4096
end
write memory

!Configuracion de Etherchannel
enable
configure terminal
interface range GigabitEthernet1/1-2
    channel-group 1 mode active
interface range GigabitEthernet2/1-2
    channel-group 2 mode active
interface range GigabitEthernet3/1-2
    channel-group 3 mode active
end
write

!Configuracion de interfaces TRUNK
enable
configure terminal
interface port-channel 1
    switchport trunk encapsulation dot1q
    switchport mode trunk
    switchport trunk allowed vlan 10,20,30,40
    switchport trunk native vlan 99
interface port-channel 2
    switchport trunk encapsulation dot1q
    switchport mode trunk
    switchport trunk allowed vlan 10,20,30,40
    switchport trunk native vlan 99
interface port-channel 3
    switchport trunk encapsulation dot1q
    switchport mode trunk
    switchport trunk allowed vlan 10,20,30,40
    switchport trunk native vlan 99
end
write memory

!Configuracion de SVI
enable
configure terminal
ip routing
interface vlan 10
    ip address 10.1.10.1 255.255.255.0
    no shutdown
interface vlan 20
    ip address 10.1.20.1 255.255.255.0
    no shutdown
interface vlan 30
    ip address 10.1.30.1 255.255.255.0
    no shutdown
interface vlan 40
    ip address 10.1.40.1 255.255.255.0
    no shutdown
end
write

!Configuracion de HSRP y Tracking
enable
configure terminal

track 1 interface GigabitEthernet0/1 line-protocol
track 2 interface GigabitEthernet0/2 line-protocol
track 10 list boolean or
    object 1
    object 2
exit

interface vlan 10
    standby version 2
    standby 10 ip 10.1.10.10
    standby 10 priority 250
    standby 10 preempt
    standby 10 track 10 decrement 20
interface vlan 20
    standby version 2
    standby 20 ip 10.1.20.10
    standby 20 priority 240
    standby 20 preempt
interface vlan 30
    standby version 2
    standby 30 ip 10.1.30.10
    standby 30 priority 240
    standby 30 preempt
interface vlan 40
    standby version 2
    standby 40 ip 10.1.40.10
    standby 40 priority 250
    standby 40 preempt
    standby 40 track 10 decrement 20
end
write