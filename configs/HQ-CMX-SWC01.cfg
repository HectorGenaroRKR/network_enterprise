enable
configure terminal
hostname HQ-CMX-SWC01

interface GigabitEthernet0/1
 description Link to Router Core 01 (HQ-CMX-RTR01 Gi1/0)
 no shutdown

interface GigabitEthernet0/2
 description Link to Router Core 02 (HQ-CMX-RTR02 Gi1/0)
 no shutdown

interface GigabitEthernet1/1
 description Link to Switch Access 01 (HQ-CMX-SWA01 Gi1/1 - Po1)
 no shutdown

interface GigabitEthernet1/2
 description Link to Switch Access 01 (HQ-CMX-SWA01 Gi1/2 - Po1)
 no shutdown

interface GigabitEthernet2/1
 description Link to Switch Access 02 (HQ-CMX-SWA02 Gi1/1 - Po2)
 no shutdown

interface GigabitEthernet2/2
 description Link to Switch Access 02 (HQ-CMX-SWA02 Gi1/2 - Po2)
 no shutdown

interface GigabitEthernet3/1
 description Link to Switch Access 03 (HQ-CMX-SWA03 Gi1/1 - Po3)
 no shutdown

interface GigabitEthernet3/2
 description Link to Switch Access 03 (HQ-CMX-SWA03 Gi1/2 - Po3)
 no shutdown
end
write memory

!Configuracion de VLANs
enable
configure terminal
vlan 10
 name MANAGEMENT
vlan 20
 name USERS
vlan 30
 name VoIP
vlan 40
 name SERVERS
vlan 99
 name NATIVE
vlan 999
 name BLACKHOLE
end
write memory

!Configuracion de STP
enable
configure terminal
spanning-tree mode rapid-pvst
spanning-tree vlan 1 priority 0
spanning-tree vlan 10 priority 0
spanning-tree vlan 40 priority 0
spanning-tree vlan 999 priority 0

spanning-tree vlan 20 priority 4096
spanning-tree vlan 30 priority 4096
spanning-tree vlan 99 priority 4096
end
write memory

!Configuracion de Etherchannel
enable
configure terminal
interface range GigabitEthernet1/1-2
channel-group 1 mode active
interface range GigabitEthernet2/1-2
channel-group 2 mode active
interface range GigabitEthernet3/1-2
channel-group 3 mode active
end
write

!Configuracion de interfaces TRUNK
enable
configure terminal
interface port-channel 1
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk allowed vlan 10,20,30,40
switchport trunk native vlan 99
interface port-channel 2
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk allowed vlan 10,20,30,40
switchport trunk native vlan 99
interface port-channel 3
switchport trunk encapsulation dot1q
switchport mode trunk
switchport trunk allowed vlan 10,20,30,40
switchport trunk native vlan 99
end
write memory